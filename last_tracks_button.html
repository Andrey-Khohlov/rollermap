
<div id="tracks-button" style="
    position: fixed;
    bottom: 10px;
    right: 95px;
    background: white;
    padding: 2px 4px;
    border: 1px solid grey;
    border-radius: 4px;
    box-shadow: 0 0 5px grey;
    z-index: 999;
    cursor: pointer;
    transition: all 0.3s ease;
">
    <div onclick="window.location.href='last_tracks.html'"
         style="cursor: pointer; font-weight: bold; color: #333; margin: 0; padding: 0; line-height: 1.1;">
        <span style="margin-right: 4px;">▶</span> Последние треки
    </div>
</div>

<script>
    // Эффекты при наведении (аналогичные первому варианту)
    const button = document.getElementById('tracks-button');

    button.addEventListener('mouseenter', function() {
        this.style.background = '#f8f9fa';
        this.style.boxShadow = '0 0 4px rgba(0,0,0,0.3)';
    });

    button.addEventListener('mouseleave', function() {
        this.style.background = 'white';
        this.style.boxShadow = '0 0 5px grey';
    });
</script>
