<script>
    (function() {{
        function waitForMap() {{
            if (typeof map === 'undefined') {{
                console.log("Ждём инициализации карты...");
                setTimeout(waitForMap, 200);
                return;
            }}
            console.log("Карта загружена, привязываем обработчик рисования");
            map.on(L.Draw.Event.CREATED, function(event) {{
                var layer = event.layer;
                var drawnGeoJSON = layer.toGeoJSON();
                var userName = prompt("Введите ваше имя:", "Аноним") || "Аноним";
                var dataToSend = {{
                    geojson: drawnGeoJSON,
                    user: userName
                }};
                fetch("{GAS_URL}", {{
                    method: "POST",
                    mode: "no-cors",
                    headers: {{"Content-Type": "application/json"}},
                    body: JSON.stringify(dataToSend)
                }})
                .then(function() {{
                    console.log("Отправлено!");
                    layer.bindPopup("✅ Сохранено для " + userName).openPopup();
                }})
                .catch(function(error) {{
                    console.error("Ошибка:", error);
                    layer.bindPopup("❌ Ошибка сохранения").openPopup();
                }});
            }});
        }}
        if (document.readyState === 'loading') {{
            document.addEventListener('DOMContentLoaded', waitForMap);
        }} else {{
            waitForMap();
        }}
    }})();
</script>
