
<div id="tracks-button" style="
    position: fixed;
    bottom: 6px;
    right: 4px;
    z-index: 999;
    cursor: pointer;
    transition: all 0.3s ease;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
">
    
    <button onclick="window.location.href='last_tracks.html'"
            style="cursor: pointer; font-weight: bold; color: #333; margin: 0; padding: 2px 6px; line-height: 1.1; border-radius: 4px; border: 1px solid #ccc; background: #fff;">
        <span style="margin-right: 4px;">▶</span> 2 недели
    </button>
    <button onclick="window.location.href='index.html'"
            style="cursor: pointer; font-weight: bold; color: #333; margin: 0; padding: 2px 6px; line-height: 1.1; border-radius: 4px; border: 1px solid #ccc; background: #fff;">
        <span style="margin-right: 4px;">▶</span> 2026
    </button>
    <button onclick="window.location.href='tracks2025.html'"
            style="cursor: pointer; font-weight: bold; color: #333; margin: 0; padding: 2px 6px; line-height: 1.1; border-radius: 4px; border: 1px solid #ccc; background: #fff;">
        <span style="margin-right: 4px;">▶</span> 2025
    </button>
</div>

<script>
    // Эффекты при наведении (аналогичные первому варианту)
    const button = document.getElementById('tracks-button');

    button.addEventListener('mouseenter', function() {
        this.style.background = '#f8f9fa';
        this.style.boxShadow = '0 0 4px rgba(0,0,0,0.3)';
    });

    button.addEventListener('mouseleave', function() {
        this.style.background = 'white';
        this.style.boxShadow = '0 0 5px grey';
    });
</script>
